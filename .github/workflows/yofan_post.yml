name: YoFan Automated Posting

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

jobs:
  auto-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Verify Files
        run: ls -la

      - name: Run Posting Script
        env:
          YOFAN_USER: ${{ secrets.YOFAN_USER }}
          YOFAN_PASS: ${{ secrets.YOFAN_PASS }}
          YOFAN_USERNAME: ${{ secrets.YOFAN_USERNAME }}
        run: python yofan_post.py
